version: '3.8'

services:
  ml-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-pipeline-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ml-trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-pipeline-trainer
    command: ["python", "main.py", "--mode", "all"]
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    profiles:
      - training
